# Shared by all three nodes (db, db-standby1, db-standby2); cluster_name comes from the compose command.
# synchronous_standby_names and primary_conninfo live in postgresql.auto.conf (ALTER SYSTEM) because
# scripts/failover.sh rewrites them; do not set them here or on the command line (that would override ALTER SYSTEM).
listen_addresses = '*'
hba_file = '/etc/faceauth-db/pg_hba.conf'
max_connections = 200
shared_buffers = 512MB
password_encryption = scram-sha-256

# Replication: every commit waits until >= 1 standby has flushed it (RPO=0 on single-node loss).
wal_level = replica
synchronous_commit = on
max_wal_senders = 10
wal_keep_size = 2GB              # no slots: a dead standby must never fill the primary's disk
wal_log_hints = on               # allows pg_rewind of a fenced old primary (we re-clone by default)
wal_sender_timeout = 10s
wal_receiver_timeout = 10s
wal_retrieve_retry_interval = 1s
hot_standby = on
hot_standby_feedback = on        # read-only users (search/engine) may read from standbys
recovery_target_timeline = 'latest'

log_line_prefix = '%m [%p] %q%u@%d '
log_min_duration_statement = 2s
