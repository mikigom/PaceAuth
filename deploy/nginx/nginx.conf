# mTLS gateway (docs/IMPLEMENTATION.md §6): the only way into api-1/api-2 for devices.
# TLS 1.3 only; every client must present a certificate issued by secrets/ca.crt. The verified certificate is
# forwarded as X-Client-Cert (URL-escaped PEM) + X-Client-Verify; the API binds it to the claimed device_id.
# Request bodies (raw capture frames) are buffered in memory only: client_body_buffer_size = max body, and the
# temp paths are tmpfs in compose, so frames never touch a disk.
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 4096; }

http {
    server_tokens off;
    access_log /dev/stdout;
    resolver 127.0.0.11 valid=5s ipv6=off;   # Docker DNS: follow api container restarts / IP changes

    upstream api {
        zone api 64k;
        # passive health checks: 3 failed connects in 10 s => replica skipped for 10 s
        server api-1:8000 resolve max_fails=3 fail_timeout=10s;
        server api-2:8000 resolve max_fails=3 fail_timeout=10s;
        keepalive 64;
        keepalive_timeout 60s;               # < uvicorn --timeout-keep-alive 75: the API never closes first
    }

    server {
        listen 8443 ssl;
        ssl_certificate         /run/secrets/gateway_crt;
        ssl_certificate_key     /run/secrets/gateway_key;
        ssl_protocols           TLSv1.3;
        ssl_client_certificate  /run/secrets/ca_crt;
        ssl_verify_client       on;
        ssl_verify_depth        2;
        ssl_session_cache       shared:TLS:10m;
        ssl_session_tickets     off;

        client_max_body_size    32m;         # enrollment packets: ~18-40 RGB-D-IR frames, ~25 MB
        client_body_buffer_size 32m;         # keep the whole body in memory (never a temp file)
        client_body_timeout     30s;
        client_header_timeout   10s;
        keepalive_timeout       30s;
        send_timeout            30s;

        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            # replace (never pass through) anything the client sent under these names
            proxy_set_header X-Client-Cert   $ssl_client_escaped_cert;
            proxy_set_header X-Client-Verify $ssl_client_verify;
            proxy_request_buffering on;
            proxy_connect_timeout 2s;
            proxy_send_timeout    30s;
            proxy_read_timeout    90s;       # enrollment analysis on the GPU engine can take a while
            # Next replica only when the request did not reach the API: nginx never re-sends a non-idempotent
            # request (POST) once it was sent upstream (no "non_idempotent" flag); 5xx answers are not retried.
            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 5s;
        }
    }
}
