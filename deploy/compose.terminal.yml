# Merge with docker-compose.yml; hardware capture is operator-invoked only.
services:
  terminal:
    profiles: [hardware-tools]
    image: faceauth-terminal:dev
    build:
      context: .
      dockerfile: docker/terminal.Dockerfile
    init: true
    read_only: true
    tmpfs: [/tmp]
    working_dir: /tmp
    volumes:
      - .:/app:ro
      - /dev/bus/usb:/dev/bus/usb
    device_cgroup_rules:
      - 'c 189:* rw'
    # Depth EGL on the iGPU; NVIDIA below is reserved for face inference.
    devices:
      - source: ${FA_DRM_RENDER_NODE:-/dev/dri/renderD128}
        target: /dev/dri/renderD128
        permissions: rw
    networks: [edge, internal]
    environment:
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/.cache
      MESA_SHADER_CACHE_DIR: /tmp/mesa
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      LP_NUM_THREADS: '4'
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, device_ids: ['${FA_GPU_DEVICE_ID:-0}'], capabilities: [gpu]}]
